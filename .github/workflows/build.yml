name: Build APK

# Every push builds an APK you can download from the run's "Artifacts".
# A push to main whose commit message contains "[release]", a manual "Run workflow" on main with
# "Publish this main build as a release" ticked, or a pushed v* tag also publishes a GitHub
# Release with ravine.apk, so the Shield can always install the newest one with the Downloader app from:
#   https://github.com/TheyH8CaMpS/ravine/releases/latest/download/ravine.apk
# (Requested by the owner: Claude sessions can't push tags, so the workflow creates the release itself.)
# Pull requests build and test too, with read-only access; don't add [skip ci] to code changes, so every PR
# shows a green "Build APK" run before merge. Only the release job can write to the repository.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish this main build as a release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      build: ${{ steps.version.outputs.build }}
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Write keys.properties from secrets
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        run: |
          {
            echo "TMDB_KEY=${TMDB_KEY}"
            echo "SIMKL_CLIENT_ID=${SIMKL_CLIENT_ID}"
          } > keys.properties
          if [ -z "${TMDB_KEY}" ]; then echo "::warning::TMDB_KEY secret is not set: artwork will be missing."; fi

      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.RAVINE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_B64}" ]; then
            echo "${KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/ravine.jks"
            echo "RAVINE_KEYSTORE_FILE=${RUNNER_TEMP}/ravine.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::RAVINE_KEYSTORE_BASE64 is not set: signed with a throwaway debug key (can't update over other builds)."
          fi

      - name: Build and test
        env:
          RAVINE_KEYSTORE_PASSWORD: ${{ secrets.RAVINE_KEYSTORE_PASSWORD }}
        run: |
          python3 ../tools/test_release_order.py
          RAVINE_COMMIT_COUNT="$(git rev-list --count HEAD)"
          export RAVINE_COMMIT_COUNT
          ./gradlew --no-daemon assembleRelease testReleaseUnitTest

      - name: Verify and read the APK version
        id: version
        run: |
          apk=app/build/outputs/apk/release/output-metadata.json
          code=$(jq -er '.elements[] | select(.outputFile == "app-release.apk") | .versionCode | select(type == "number")' "$apk")
          if (( code < 210 )); then
            echo '::error::APK version code is below the published Build 110 floor (210).'
            exit 1
          fi
          name=$(jq -er '.elements[] | select(.outputFile == "app-release.apk") | .versionName' "$apk")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "build=$((code - 100))" >> "$GITHUB_OUTPUT"

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk ravine.apk

      - uses: actions/upload-artifact@v5
        with:
          name: ravine-apk
          path: source/ravine.apk

  release:
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release)
    runs-on: ubuntu-latest
    concurrency:
      group: ravine-release
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check published APK build numbers
        id: ordering
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_BUILD: ${{ needs.build.outputs.build }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select((.draft | not) and (.prerelease | not) and any(.assets[]; .name == "ravine.apk")) | {tag_name, name}' \
            | python3 tools/release_order.py "$APK_BUILD" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v5
        if: steps.ordering.outputs.publish == 'true'
        with:
          name: ravine-apk
          path: source

      - name: Publish release
        if: steps.ordering.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build{1}', needs.build.outputs.version, needs.build.outputs.build) }}
          name: Ravine ${{ needs.build.outputs.version }} (build ${{ needs.build.outputs.build }})
          target_commitish: ${{ github.sha }}
          files: source/ravine.apk
          generate_release_notes: true
          make_latest: true
